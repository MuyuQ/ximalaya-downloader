<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>喜马拉雅下载器 Web</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f8fafc;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        --primary: #2563eb;
        --primary-contrast: #ffffff;
        --header-bg: #111827;
        --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
      }
      html { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Microsoft YaHei", sans-serif;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      .container { max-width: 1024px; margin: 0 auto; padding: 0 16px; }
      header { background: var(--header-bg); color: #fff; }
      header .container { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
      nav { display: flex; align-items: center; gap: 8px; }
      nav a { color: #fff; text-decoration: none; padding: 8px 10px; border-radius: 8px; opacity: .9; }
      nav a:hover { opacity: 1; background: rgba(255,255,255,.08); }
      nav a.active { background: var(--primary); color: var(--primary-contrast); opacity: 1; }
      #theme-toggle { appearance: none; border: 1px solid rgba(255,255,255,.2); background: transparent; color: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
      #theme-toggle:hover { background: rgba(255,255,255,.08); }
      main { padding: 24px 0; }
      h1, h2 { margin: 0 0 12px; }
      p { color: var(--muted); }
      #app > div { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; }
      button { border: 1px solid var(--primary); background: var(--primary); color: var(--primary-contrast); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
      button:hover { filter: brightness(1.05); }
      input, select { border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 8px 10px; }
      input[type="text"], input[type="number"], select { width: 100%; max-width: 560px; }
      hr { border: 0; border-top: 1px solid var(--border); }
      details { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
      details[open] { box-shadow: var(--shadow); }
      details summary { cursor: pointer; padding: 10px 12px; }
      .guide-box { padding: 12px; border-top: 1px solid var(--border); background: var(--surface); border-radius: 0 0 8px 8px; }

      @media (prefers-color-scheme: dark) {
        :root { 
          --bg: #0b1220;
          --surface: #111827;
          --text: #e5e7eb;
          --muted: #94a3b8;
          --border: #1f2937;
          --primary: #60a5fa;
          --primary-contrast: #0b1220;
          --header-bg: #0f172a;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b1220;
        --surface: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --border: #1f2937;
        --primary: #60a5fa;
        --primary-contrast: #0b1220;
        --header-bg: #0f172a;
      }
      :root[data-theme="light"] {
        --bg: #ffffff;
        --surface: #f8fafc;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        --primary: #2563eb;
        --primary-contrast: #ffffff;
        --header-bg: #111827;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <strong>喜马拉雅下载器 Web</strong>
        <nav>
          <a href="#/">主页</a>
          <a href="#/sound">单集</a>
          <a href="#/album">专辑</a>
          <a href="#/settings">设置</a>
          <a href="#/login">登录</a>
          <button id="theme-toggle" title="切换主题">🌞</button>
        </nav>
      </div>
    </header>
    <main>
      <div id="app" class="container"></div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
